<!doctype html>
<meta charset="utf-8">
<title>MINOR INDEX Atelier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap">
<style>
  /* the identity's own ink table — _mark.js, not a new palette */
  :root {
    --black:#141410; --white:#f4f4f2; --grey:#e4e4e0; --fluo:#e8ff00; --blu:#001ef7;
    --ground:#8f8f8c; --rule:#141410; --dim:#6f6f6a; --dimmer:#8a8a85;
    --sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--ground); color:var(--black);
    font:400 12.5px/1.5 var(--sans); font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    display:grid; grid-template-rows:auto 1fr auto; height:100vh; overflow:hidden;
  }
  h1,h2,h3 { margin:0; font-weight:700; }
  button, input, select { font:inherit; color:inherit; }
  .caps { font-stretch:118%; letter-spacing:.13em; text-transform:uppercase; }

  header { display:flex; align-items:stretch; background:var(--white); border-bottom:1px solid var(--rule); }
  .brand { display:flex; align-items:center; gap:9px; padding:0 13px; border-right:1px solid var(--rule); flex:none; }
  .brand .dot { width:9px; height:9px; background:var(--black); flex:none; }
  .brand h1 { font-size:12.5px; font-stretch:118%; letter-spacing:.13em; text-transform:uppercase; white-space:nowrap; }
  nav { display:flex; align-items:stretch; flex:none; }
  nav a { display:flex; align-items:center; padding:0 13px; text-decoration:none; color:inherit;
          border-right:1px solid var(--rule); font-size:11px; font-weight:600; font-stretch:112%;
          letter-spacing:.09em; text-transform:uppercase; white-space:nowrap; }
  nav a:hover { background:var(--grey); }
  nav a[aria-current=page] { background:var(--black); color:var(--white); }
  nav a:focus-visible { outline:2px solid var(--blu); outline-offset:-2px; }
  .plateid { display:flex; align-items:center; gap:7px; padding:8px 12px; border-right:1px solid var(--rule); flex:none; }
  .plateid .lbl { color:var(--dim); font-size:11px; }
  .plateid input { background:transparent; border:0; border-bottom:1px solid var(--rule); padding:2px 3px; font-weight:600; }
  .plateid input.num { width:46px; text-align:right; }
  .plateid input.nom { width:130px; }
  .plateid input:focus { outline:none; border-bottom-color:var(--blu); background:#fff; }
  .acts { display:flex; align-items:center; gap:5px; padding:8px 10px; flex:1 1 auto; min-width:0; }
  .stats { margin-left:auto; display:flex; gap:12px; align-items:center; padding:0 12px; flex:none;
           white-space:nowrap; border-left:1px solid var(--rule); color:var(--dim); font-size:11.5px; }
  .stats b { color:var(--black); font-weight:700; }

  button.b { white-space:nowrap; flex:none; background:var(--white); border:1px solid var(--rule);
             padding:5px 11px; cursor:pointer; font-size:11px; font-weight:600;
             font-stretch:112%; letter-spacing:.09em; text-transform:uppercase; }
  button.b:hover { background:var(--grey); }
  button.b:active { background:var(--black); color:var(--white); }
  button.b:focus-visible { outline:2px solid var(--blu); outline-offset:1px; }
  button.b.key { background:var(--fluo); }
  button.b.key:hover { background:#f1ff5e; }
  button.b.ghost { background:transparent; font-weight:500; }
  button.b[aria-pressed=true] { background:var(--black); color:var(--white); }

  main { display:grid; grid-template-columns:1fr 372px; min-height:0; }
  .stage { position:relative; display:grid; place-items:center; padding:26px; min-height:0; overflow:hidden; }
  .sheet { box-shadow:0 2px 0 rgba(0,0,0,.4); line-height:0; max-width:100%; }
  .sheet svg { display:block; max-width:none; max-height:none; }
  .stagenote { position:absolute; left:22px; bottom:11px; font-size:10.5px; color:#3f3f3b;
               font-stretch:112%; letter-spacing:.1em; text-transform:uppercase;
               background:var(--ground); padding:3px 7px; pointer-events:none; }
  .viewport { position:absolute; inset:0; overflow:hidden; display:grid; place-items:center; cursor:grab; }
  .viewport.dragging { cursor:grabbing; }
  .sheet { transform-origin:center center; will-change:transform; }
  .zoom { position:absolute; right:22px; bottom:11px; display:flex; align-items:center; gap:4px; }
  .zoom .b { padding:3px 8px; background:var(--white); }
  .zval { font-size:11px; font-weight:600; min-width:46px; text-align:center; color:#2c2c28;
          background:var(--white); border:1px solid var(--rule); padding:3px 0; }
  .stagefail { padding:20px; background:var(--white); border:1px solid var(--rule); max-width:52ch; }
  .stagefail h3 { font-size:12px; margin-bottom:6px; }
  .stagefail code { color:var(--blu); }
  .sheetnine { position:fixed; inset:0; background:rgba(20,20,16,.94); z-index:20; display:flex;
               flex-direction:column; }
  .sheetnine[hidden] { display:none; }
  .ninebar { display:flex; align-items:baseline; gap:10px; padding:12px 16px; color:var(--white);
             border-bottom:1px solid #3a3a35; }
  .ninebar h3 { font-size:12px; font-stretch:118%; letter-spacing:.14em; text-transform:uppercase; }
  .ninebar .note { font-size:11px; color:#a3a39e; }
  .ninebar .b { margin-left:auto; background:transparent; color:var(--white); border-color:#6b6b66; }
  .ninegrid { flex:1; overflow:auto; display:grid; gap:12px; padding:14px;
              grid-template-columns:repeat(3,1fr); }
  .ninecell { background:var(--ground); border:1px solid #3a3a35; display:grid; place-items:center;
              padding:10px; cursor:pointer; min-height:150px; position:relative; }
  .ninecell:hover { outline:2px solid var(--fluo); outline-offset:-2px; }
  .ninecell svg { max-width:100%; max-height:26vh; width:auto; height:auto; display:block; }
  .ninecell .tag { position:absolute; left:6px; bottom:5px; font-size:10px; color:#2a2a26;
                   background:var(--fluo); padding:1px 5px; }
  .busy { position:absolute; right:22px; top:14px; width:9px; height:9px; background:var(--blu); opacity:0; }
  .busy.on { opacity:1; }

  .panel { background:var(--white); border-left:1px solid var(--rule); overflow-y:auto; min-height:0; }
  .presets { padding:11px 13px; border-bottom:1px solid var(--rule); display:flex; flex-wrap:wrap; gap:5px; }
  .presets .lab { width:100%; font-size:10px; color:var(--dim); margin-bottom:3px;
                  font-stretch:118%; letter-spacing:.14em; text-transform:uppercase; }
  .presets button { border:1px solid var(--rule); background:transparent; padding:3px 7px;
                    font-size:10.5px; font-weight:500; cursor:pointer; }
  .presets button:hover { background:var(--fluo); }

  section.grp { border-bottom:1px solid var(--rule); }
  section.grp > h2 { display:flex; align-items:baseline; gap:8px; padding:10px 13px; cursor:pointer;
                     user-select:none; font-size:11.5px; font-stretch:118%; letter-spacing:.14em;
                     text-transform:uppercase; flex-wrap:wrap; }
  section.grp > h2 .note { font-size:11px; font-weight:400; font-stretch:100%; letter-spacing:0;
                           text-transform:none; color:var(--dim); }
  section.grp > h2::before { content:"−"; width:10px; color:var(--dim); }
  section.grp.shut > h2::before { content:"+"; }
  section.grp.shut .fields { display:none; }
  .fields { padding:0 13px 13px; display:flex; flex-direction:column; gap:11px; }

  .f { display:grid; grid-template-columns:1fr auto; gap:3px 8px; align-items:center; }
  .f.hide { display:none; }
  .f label { font-size:11.5px; font-weight:500; }
  .f .val { font-size:11.5px; font-weight:700; color:var(--dim); }
  .f .val.touched { color:var(--black); }
  .f .val.touched::after { content:"·"; color:var(--blu); margin-left:3px; }
  .f .help { grid-column:1/-1; font-size:11px; line-height:1.42; color:var(--dim); max-width:60ch; }
  .f .wide { grid-column:1/-1; }
  body.nohelp .help { display:none; }

  input[type=text] { width:100%; background:var(--grey); border:1px solid var(--rule); padding:5px 7px; font-size:13px; font-weight:600; letter-spacing:.04em; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:15px; background:transparent; cursor:ew-resize; }
  input[type=range]::-webkit-slider-runnable-track { height:2px; background:var(--black); }
  input[type=range]::-moz-range-track { height:2px; background:var(--black); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:9px; height:16px; background:var(--black); border:0; margin-top:-7px; }
  input[type=range]::-moz-range-thumb { width:9px; height:16px; background:var(--black); border:0; border-radius:0; }
  input[type=range]:focus-visible::-webkit-slider-thumb { background:var(--blu); }
  input[type=range]:focus-visible::-moz-range-thumb { background:var(--blu); }
  select, input[type=number] { width:100%; background:var(--grey); border:1px solid var(--rule); padding:4px 6px; font-size:11.5px; }
  select:focus, input:focus { outline:1px solid var(--blu); }
  .swatches { display:flex; gap:4px; grid-column:1/-1; }
  .swatches button { width:100%; height:19px; border:1px solid var(--rule); cursor:pointer; padding:0; position:relative; }
  .swatches button[aria-pressed=true]::after { content:""; position:absolute; inset:2px; border:1px solid var(--blu); }
  .sw-black{background:#141410}.sw-white{background:#f4f4f2}.sw-fluo{background:#e8ff00}
  .sw-blu{background:#001ef7}.sw-grey{background:#e4e4e0}
  .sw-none{background:repeating-linear-gradient(45deg,#fff,#fff 3px,#cfcfcb 3px,#cfcfcb 6px)}
  .chk { display:flex; align-items:center; gap:7px; grid-column:1/-1; cursor:pointer; background:transparent;
         border:1px solid var(--rule); padding:3px 7px; font-size:11.5px; font-weight:500; }
  .chk .box { width:12px; height:12px; border:1px solid var(--rule); background:var(--white); flex:none; }
  .chk[aria-pressed=true] { background:var(--black); color:var(--white); }
  .chk[aria-pressed=true] .box { background:var(--fluo); border-color:var(--fluo); }
  .seedrow { display:flex; gap:5px; grid-column:1/-1; }
  .seedrow input { flex:1; }

  footer { background:var(--black); color:var(--white); border-top:1px solid var(--rule); }
  .draw { display:flex; align-items:center; gap:10px; padding:8px 14px; cursor:pointer; }
  .draw h3 { font-size:11.5px; font-stretch:118%; letter-spacing:.14em; text-transform:uppercase; }
  .draw .note { font-size:11px; color:#a3a39e; }
  .draw .arrow { margin-left:auto; }
  pre { margin:0; padding:0 14px 15px; max-height:34vh; overflow:auto; font-family:var(--sans);
        font-size:12px; line-height:1.62; white-space:pre; color:#e9e9e5; }
  pre b { color:var(--fluo); font-weight:600; }
  pre i { color:#8f8f8a; font-style:normal; }
  footer.shut pre { display:none; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--fluo);
           color:var(--black); border:1px solid var(--rule); padding:6px 14px; font-size:11px;
           font-weight:600; font-stretch:112%; letter-spacing:.09em; text-transform:uppercase;
           opacity:0; pointer-events:none; transition:opacity .18s; }
  .toast.on { opacity:1; }
  @media (prefers-reduced-motion:reduce) { .toast { transition:none; } }
  @media (max-width:1180px) { header { flex-wrap:wrap; } .stats { border-left:0; } }
  @media (max-width:900px) {
    body { height:auto; overflow:auto; }
    main { grid-template-columns:1fr; }
    .panel { border-left:0; border-top:1px solid var(--rule); }
    .viewport { position:relative; height:64vh; }
    .ninegrid { grid-template-columns:repeat(2,1fr); }
  }
</style>

<header>
  <div class="brand"><span class="dot"></span><h1>Minor Index</h1></div>
  <nav>
    <a href="index.html" aria-current="page">Atelier</a>
    <a href="specimen.html" id="navType">Typeface</a>
  </nav>
  <div class="plateid">
    <span class="lbl">plate</span>
    <input class="num" id="num" value="132" inputmode="numeric" aria-label="plate number">
    <input class="nom" id="nom" value="untitled" aria-label="plate name">
  </div>
  <div class="acts">
    <button class="b key" id="roll" title="roll a whole plate at random (R)">Roll</button>
    <button class="b" id="nine" title="roll nine and pick one (N)">Nine</button>
    <button class="b" id="save" title="save the plate as SVG (S)">SVG</button>
    <button class="b" id="png" title="save a 2× PNG of the plate">PNG</button>
    <button class="b" id="ttf" title="build a font from the lettering settings and save it">TTF</button>
    <button class="b" id="copycode" title="copy the code that rebuilds this plate (C)">Code</button>
    <button class="b ghost" id="explain" aria-pressed="true" title="show what each control does">Explain</button>
    <button class="b ghost" id="reset" title="back to the default plate">Reset</button>
  </div>
  <div class="stats">
    <span><b id="sdim">—</b> px</span><span><b id="sdots">—</b> dots</span>
    <span><b id="skb">—</b> kb</span><span><b id="sms">—</b> ms</span>
  </div>
</header>

<main>
  <div class="stage">
    <div class="viewport" id="viewport"><div class="sheet" id="sheet"></div></div>
    <div class="stagenote">one plate — a body, an appetite, a press, and its furniture</div>
    <div class="zoom">
      <button class="b ghost" id="zout" title="zoom out">−</button>
      <button class="b ghost" id="zfit" title="fit the sheet (0)">Fit</button>
      <span class="zval" id="zval">100%</span>
      <button class="b ghost" id="zin" title="zoom in">+</button>
    </div>
    <div class="busy" id="busy"></div>
  </div>
  <div class="panel" id="panel">
    <div class="presets" id="presets"><span class="lab">start from a plate that exists</span></div>
  </div>
</main>

<footer id="footer" class="shut">
  <div class="draw" id="draw">
    <h3>The code</h3>
    <span class="note">paste it into any mk*.js — it rebuilds this exact plate, byte for byte</span>
    <span class="arrow" id="arrow">▲</span>
  </div>
  <pre id="code"></pre>
</footer>
<div class="toast" id="toast"></div>
<div class="sheetnine" id="nineview" hidden>
  <div class="ninebar">
    <h3>Nine rolls</h3><span class="note">click one to take it — Esc to leave</span>
    <button class="b ghost" id="nineclose">Close</button>
  </div>
  <div class="ninegrid" id="ninegrid"></div>
</div>

<script src="_bundle.js"></script>
<script>
(function () {
  "use strict";
  var M = window.MINOR;
  var KEY = "minor-atelier-v2";
  var state = Object.assign({}, M.DEFAULTS, { name: "untitled" });
  try { var kept = localStorage.getItem(KEY); if (kept) state = Object.assign(state, JSON.parse(kept)); } catch (e) {}

  /* twelve starting points — one per body, each taken off a plate that exists */
  var PRESETS = [
    ["emblem 77", { format:"emblem", bg:"black", ink:"white", sym:"sun", mode:"plein", size:620,
      px:100, py:210, rays:30, disc:0.23, seed:77, fInk:"white", fRing:true, fTicks:true }],
    ["overexposed 78", { bg:"white", ink:"black", sym:"sun", size:760, px:-60, py:-150,
      rays:26, disc:0.2, seed:78, pitch:7.4, falloff:15, dspread:0.66, grain:0.26, angle:15 }],
    ["knocked out 79", { bg:"black", ink:"white", sym:"sun", size:420, px:110, py:110, rays:32,
      seed:79, pitch:4.2, falloff:8, angle:75, pseed:9, fInk:"white", fAxes:true, fBrackets:true }],
    ["network 82", { format:"paysage", bg:"black", ink:"white", sym:"network", size:600, px:150,
      py:20, count:6, sat:4, seed:23, pitch:3.6, falloff:6, fInk:"white" }],
    ["corona 91", { format:"carre760", bg:"black", ink:"white", sym:"corona", size:700, px:30, py:30,
      rays:40, disc:0.16, reachB:0.48, seed:91, mode:"plein", fInk:"white" }],
    ["seed head 103", { format:"carre760", bg:"white", ink:"black", sym:"seed", size:640, px:60, py:40,
      seeds:300, gspace:16, pitch:4.2, falloff:7, dspread:0.56, fBand:true, fBandInk:"fluo" }],
    ["vortex 101", { bg:"white", ink:"black", sym:"sun", size:780, px:-70, py:-140, rays:28,
      disc:0.18, seed:101, twist:0.0052, pitch:7.2, falloff:15, dspread:0.68, grain:0.26 }],
    ["ouroboros 105", { format:"carre760", bg:"black", ink:"white", sym:"spiral", size:700, px:30, py:30,
      turns:3.4, tight:0.19, sband:34, pitch:4, falloff:8, pseed:7, fInk:"white", fTicks:true }],
    ["shell 113", { bg:"white", ink:"black", sym:"shell", mode:"plein", size:560, px:40, py:40,
      turns:2.75, tight:0.205, sband:14, fBrackets:true, fAxes:true }],
    ["choke & spread 119", { bg:"white", ink:"black", sym:"sun", size:540, px:50, py:50, rays:26,
      disc:0.24, seed:119, plate2:"grossi", p2ink:"blu", p2grow:9, grow:-5, grain:0.12, fReg:true }],
    ["printed cell 122", { format:"carre760", bg:"white", ink:"black", sym:"cell", size:900, px:-70,
      py:-70, sat:5, seed:23, pitch:7, falloff:15, dspread:0.68, grain:0.26, wobAmp:7, wobScale:46 }],
    ["lace 129", { format:"carre760", bg:"black", ink:"white", sym:"lace", size:700, px:30, py:30,
      rays:30, disc:0.24, seeds:430, gspace:15.5, seed:129, pitch:3.4, falloff:6, angle:75,
      pseed:7, fInk:"white" }]
  ];

  var panel = document.getElementById("panel"), rows = {};
  function el(t, cls, txt) { var e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  M.PARAMS.forEach(function (grp) {
    var sec = el("section", "grp");
    var h = el("h2");
    var gl = el("span", null, grp.label); gl.style.whiteSpace = "nowrap";
    h.appendChild(gl); h.appendChild(el("span", "note", grp.note));
    h.onclick = function () { sec.classList.toggle("shut"); };
    var box = el("div", "fields");
    sec.appendChild(h); sec.appendChild(box); panel.appendChild(sec);

    grp.fields.forEach(function (f) {
      var row = el("div", "f");
      var lab = el("label", null, f.label); lab.htmlFor = "c_" + f.id;
      var val = el("span", "val");
      row.appendChild(lab); row.appendChild(val);
      var input;

      if (f.type === "range") {
        input = el("input"); input.type = "range"; input.min = f.min; input.max = f.max; input.step = f.step;
        input.className = "wide"; input.id = "c_" + f.id;
        input.oninput = function () { set(f.id, parseFloat(input.value), true); };
        input.onchange = function () { set(f.id, parseFloat(input.value), false); };
        row.appendChild(input);
      } else if (f.type === "select") {
        input = el("select"); input.id = "c_" + f.id; input.className = "wide";
        f.options.forEach(function (o) { var op = el("option", null, o.label); op.value = o.v; input.appendChild(op); });
        input.onchange = function () { set(f.id, input.value, false); };
        row.appendChild(input);
      } else if (f.type === "ink") {
        input = el("div", "swatches");
        f.options.forEach(function (o) {
          var b = el("button", "sw-" + o); b.title = o; b.type = "button";
          b.onclick = function () { set(f.id, o, false); };
          input.appendChild(b);
        });
        row.appendChild(input);
      } else if (f.type === "bool") {
        input = el("button", "chk"); input.type = "button";
        input.appendChild(el("span", "box"));
        input.appendChild(el("span", "state", state[f.id] ? "on" : "off"));
        input.onclick = function () { set(f.id, !state[f.id], false); };
        row.appendChild(input);
      } else if (f.type === "text") {
        input = el("input"); input.type = "text"; input.id = "c_" + f.id; input.className = "wide";
        input.oninput = function () { set(f.id, input.value, true); };
        input.onchange = function () { set(f.id, input.value, false); };
        row.appendChild(input);
      } else if (f.type === "seed") {
        input = el("div", "seedrow");
        var num = el("input"); num.type = "number"; num.id = "c_" + f.id;
        num.onchange = function () { set(f.id, parseInt(num.value, 10) || 1, false); };
        var re = el("button", "b ghost", "↻"); re.type = "button"; re.title = "grow another one";
        re.onclick = function () { set(f.id, Math.floor(Math.random() * 900) + 3, false); };
        input.appendChild(num); input.appendChild(re); row.appendChild(input);
        input = num;
      }
      if (f.help) { var hp = el("span", "help", f.help); row.appendChild(hp); }
      box.appendChild(row);
      rows[f.id] = { row: row, input: input, val: val, f: f };
    });
  });

  var pbox = document.getElementById("presets");
  PRESETS.forEach(function (p) {
    var b = el("button", null, p[0]); b.type = "button";
    b.onclick = function () {
      state = Object.assign({}, M.DEFAULTS, p[1],
        { num: state.num, name: p[0].replace(/ \d+$/, "").replace(/[^a-z]+/gi, "-").toLowerCase() });
      sync(); render(false);
    };
    pbox.appendChild(b);
  });

  function decimals(step) { var s = String(step); return s.indexOf(".") > 0 ? s.split(".")[1].length : 0; }
  function sync() {
    Object.keys(rows).forEach(function (id) {
      var r = rows[id], v = state[id], f = r.f;
      r.row.classList.toggle("hide", !M.visible(f, state));
      var changed = v !== f.def && f.type !== "select";
      r.val.className = "val" + (changed ? " touched" : "");
      if (f.type === "range") { r.input.value = v; r.val.textContent = (+v).toFixed(decimals(f.step)); }
      else if (f.type === "select") { r.input.value = v; r.val.textContent = ""; }
      else if (f.type === "ink") {
        r.val.textContent = v;
        Array.prototype.forEach.call(r.input.children, function (b, i) {
          b.setAttribute("aria-pressed", f.options[i] === v ? "true" : "false");
        });
      } else if (f.type === "bool") {
        r.input.setAttribute("aria-pressed", v ? "true" : "false");
        r.input.children[1].textContent = v ? "on" : "off"; r.val.textContent = "";
      } else if (f.type === "seed") { r.input.value = v; r.val.textContent = ""; }
      else if (f.type === "text") {          /* leave the caret alone while typing */
        if (r.input.value !== v) r.input.value = v;
        r.val.textContent = String(v).length;
      }
    });
    document.getElementById("num").value = state.num;
    document.getElementById("nom").value = state.name;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* undo: one step per control touched, changes to the same slider coalesced */
  var hist = [], hp = -1, lastTouch = 0, lastId = null;
  function remember(id) {
    var now = Date.now();
    if (id && id === lastId && now - lastTouch < 500) { lastTouch = now; return; }
    lastId = id; lastTouch = now;
    hist = hist.slice(0, hp + 1);
    hist.push(JSON.stringify(state));
    if (hist.length > 60) hist.shift();
    hp = hist.length - 1;
  }
  function step(dir) {
    var to = hp + dir;
    if (to < 0 || to >= hist.length) return toast(dir < 0 ? "nothing to undo" : "nothing to redo");
    hp = to; state = JSON.parse(hist[hp]); lastId = null;
    sync(); render(false); toast(dir < 0 ? "undone" : "redone");
  }

  function set(id, v, dragging) {
    if (!dragging) remember(id);
    state[id] = v;
    if (id === "format" && v !== "libre") { var s = M.sheetOf(state); state.w = s.w; state.h = s.h; }
    sync(); render(dragging);
  }

  var sheetEl = document.getElementById("sheet"), busy = document.getElementById("busy");
  var viewport = document.getElementById("viewport");
  var codeEl = document.getElementById("code"), timer = null, last = "", lastSize = [640, 640];
  var KW = /\b(sunGeom|sunSolid|sunSDF|sunWhirl|cellGeom|cellSDF|cell|phylloPts|sPts|sScatter|sSpiral|spiralPath|spiralWalls|screen|sDisc|sRing|sUnion|sSub|sShift|sTwist|sGrow|sSmooth|sMorph|sWobble|sBite|mouths|discs|swipe|brackets|axes|polar|ticks|band|reg|place|G|plate|rng)\b/g;

  /* ---- zoom and pan ---------------------------------------------------- */
  var view = { z: 1, x: 0, y: 0, fitted: true };
  function applyView() {
    sheetEl.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.z + ")";
    document.getElementById("zval").textContent = Math.round(view.z * 100) + "%";
  }
  function fit() {
    var r = viewport.getBoundingClientRect();
    var pad = 34;
    view.z = Math.min((r.width - pad) / lastSize[0], (r.height - pad) / lastSize[1]);
    if (!isFinite(view.z) || view.z <= 0) view.z = 1;
    view.x = 0; view.y = 0; view.fitted = true;
    applyView();
  }
  function zoomTo(z) {
    view.z = Math.max(0.05, Math.min(8, z)); view.fitted = false; applyView();
  }
  document.getElementById("zin").onclick = function () { zoomTo(view.z * 1.25); };
  document.getElementById("zout").onclick = function () { zoomTo(view.z / 1.25); };
  document.getElementById("zfit").onclick = fit;
  viewport.addEventListener("wheel", function (e) {
    e.preventDefault(); zoomTo(view.z * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
  }, { passive: false });
  (function () {
    var down = null;
    viewport.addEventListener("pointerdown", function (e) {
      down = { x: e.clientX - view.x, y: e.clientY - view.y };
      viewport.classList.add("dragging"); viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener("pointermove", function (e) {
      if (!down) return;
      view.x = e.clientX - down.x; view.y = e.clientY - down.y; view.fitted = false; applyView();
    });
    viewport.addEventListener("pointerup", function () { down = null; viewport.classList.remove("dragging"); });
    viewport.addEventListener("pointercancel", function () { down = null; viewport.classList.remove("dragging"); });
  })();
  window.addEventListener("resize", function () { if (view.fitted) fit(); });

  /* ---- the press ------------------------------------------------------- */
  function render(draft) {
    if (timer) clearTimeout(timer);
    busy.classList.add("on");
    timer = setTimeout(function () {
      var out;
      try {
        /* dragging pulls a proof: a coarser screen, everything else the same */
        var st = draft ? Object.assign({}, state, { pitch: Math.max(state.pitch * 1.8, 3.2) }) : state;
        out = M.buildPlate(st);
      } catch (err) {
        busy.classList.remove("on");
        sheetEl.innerHTML = '<div class="stagefail"><h3>That plate would not print.</h3>'
          + "<p>The press threw <code>" + String(err && err.message).replace(/[<>&]/g, "") + "</code>. "
          + "Undo with ⌘Z, or press Reset — nothing else was lost.</p></div>";
        return;
      }
      /* one <path> of arcs instead of ninety thousand <circle> nodes */
      sheetEl.innerHTML = M.compactDots(out.svg);
      var wasFit = view.fitted, resized = lastSize[0] !== out.w || lastSize[1] !== out.h;
      lastSize = [out.w, out.h];
      if (wasFit || resized) fit(); else applyView();
      if (!draft) last = out.svg;
      document.getElementById("sdim").textContent = out.w + "×" + out.h;
      document.getElementById("sdots").textContent = out.dots.toLocaleString("en");
      document.getElementById("skb").textContent = out.kb;
      document.getElementById("sms").textContent = out.ms;
      if (!draft) {
        codeEl.innerHTML = M.emitPlate(state)
          .replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; })
          .replace(KW, "<b>$1</b>")
          .replace(/(\/\*[^*]*\*\/)/g, "<i>$1</i>");
      }
      busy.classList.remove("on");
    }, draft ? 40 : 90);
  }
  function current() { return last || M.buildPlate(state).svg; }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    setTimeout(function () { t.classList.remove("on"); }, 1500);
  }
  function copy(text, what) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(what + " copied"); },
        function () { toast("the browser refused the copy"); });
    } else { toast("clipboard unavailable here"); }
  }
  document.getElementById("roll").onclick = function () {
    remember(null);
    state = Object.assign(M.rollState(), { num: state.num, name: "roll" });
    sync(); render(false); toast("rolled");
  };

  document.getElementById("copycode").onclick = function () {
    copy(M.emitPlate(state), "code");
    document.getElementById("footer").classList.remove("shut");
    document.getElementById("arrow").textContent = "▼";
  };
  /* Save: the published page hands the file over through the host; a local
     copy writes it straight to disk; if neither will take an .svg, copy it */
  function localSave(name, text) {
    var blob = new Blob([text], { type: "image/svg+xml" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast("saved " + name);
  }
  /* a 2× raster, for anywhere an SVG is not welcome */
  function toPNG(cb) {
    try {
      var text = current(), w = lastSize[0], h = lastSize[1];
      var img = new Image();
      img.onload = function () {
        try {
          var c = document.createElement("canvas");
          c.width = w * 2; c.height = h * 2;
          var ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function (b) { cb(b); }, "image/png");
        } catch (e) { cb(null); }
      };
      img.onerror = function () { cb(null); };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(text);
    } catch (e) { cb(null); }
  }
  document.getElementById("png").onclick = function () {
    toast("rendering…");
    toPNG(function (blob) {
      if (!blob) return toast("this browser would not rasterise it — use SVG");
      var name = String(state.num) + "-" + state.name + ".png";
      var ask = (window.claude && window.claude.use) ? window.claude.use("downloads") : Promise.resolve(null);
      ask.then(function (dl) {
        if (!dl) {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob); a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
          return toast("saved " + name);
        }
        dl.save({ filename: name, data: blob }).then(
          function () { toast("saved " + name); },
          function (err) { toast(err && err.code === "declined" ? "save declined" : "png save unavailable"); });
      }, function () { toast("png save unavailable"); });
    });
  };

  /* ---- the lettering, as a font ---------------------------------------- */
  document.getElementById("ttf").onclick = function () {
    var style = state.tweight < 0.1 ? "Light" : (state.tweight < 0.16 ? "Regular" : "Bold");
    toast("outlining " + style + "…");
    setTimeout(function () {
      var out;
      try {
        out = M.font.buildTTF({ family: "Minor Index", style: style, weight: state.tweight,
          hand: state.thand, width: state.twidth, slant: state.tslant, seed: state.tseed | 0 });
      } catch (e) { return toast("the font would not build"); }
      var name = "MinorIndex-" + style + ".ttf";
      var ask = (window.claude && window.claude.use) ? window.claude.use("downloads") : Promise.resolve(null);
      ask.then(function (dl) {
        if (!dl) {
          var blob = new Blob([out.font], { type: "font/ttf" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob); a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
          return toast(name + " — " + out.glyphs + " glyphs");
        }
        dl.save({ filename: name, data: out.font }).then(
          function () { toast(name + " — " + out.glyphs + " glyphs"); },
          function (err) {
            toast(err && err.code === "declined" ? "save declined"
              : "fonts can't be saved from this page — open the local copy");
          });
      }, function () { toast("font save unavailable here"); });
    }, 30);
  };

  /* ---- nine rolls, to choose from -------------------------------------- */
  var nineView = document.getElementById("nineview"), nineGrid = document.getElementById("ninegrid");
  function closeNine() { nineView.hidden = true; nineGrid.innerHTML = ""; }
  document.getElementById("nineclose").onclick = closeNine;
  document.getElementById("nine").onclick = function () {
    nineGrid.innerHTML = ""; nineView.hidden = false;
    var states = [], i;
    for (i = 0; i < 9; i++) states.push(M.rollState());
    var k = 0;
    (function drawNext() {
      if (k >= states.length) return;
      var st = states[k], cell = document.createElement("div");
      cell.className = "ninecell";
      try { cell.innerHTML = M.compactDots(M.buildPlate(st).svg, 0); } catch (e) { cell.textContent = "—"; }
      var tag = document.createElement("span");
      tag.className = "tag"; tag.textContent = st.sym + (st.mode === "plein" ? " · flat" : "");
      cell.appendChild(tag);
      cell.onclick = (function (s2) {
        return function () { remember(null); state = Object.assign(s2, { num: state.num, name: "roll" });
          closeNine(); sync(); render(false); toast("taken"); };
      })(st);
      nineGrid.appendChild(cell);
      k++;
      requestAnimationFrame(drawNext);
    })();
  };

  document.getElementById("save").onclick = function () {
    var name = String(state.num) + "-" + state.name + ".svg", text = current();
    var ask = (window.claude && window.claude.use) ? window.claude.use("downloads") : Promise.resolve(null);
    ask.then(function (dl) {
      if (!dl) return localSave(name, text);
      dl.save({ filename: name, data: text }).then(
        function () { toast("saved " + name); },
        function (err) {
          var c = err && err.code;
          if (c === "declined") return toast("save declined");
          if (c === "rate_limited") return toast("one save at a time — try again");
          copy(text, "SVG");
        });
    }, function () { localSave(name, text); });
  };
  var ex = document.getElementById("explain");
  ex.onclick = function () {
    var on = ex.getAttribute("aria-pressed") !== "true";
    ex.setAttribute("aria-pressed", on ? "true" : "false");
    document.body.classList.toggle("nohelp", !on);
  };
  document.getElementById("reset").onclick = function () {
    remember(null);
    state = Object.assign({}, M.DEFAULTS, { name: "untitled" }); sync(); render(false);
  };
  document.getElementById("num").onchange = function (e) { state.num = parseInt(e.target.value, 10) || 132; sync(); render(false); };
  document.getElementById("nom").onchange = function (e) { state.name = (e.target.value || "untitled").trim().replace(/\s+/g, "-"); sync(); render(false); };
  var footer = document.getElementById("footer");
  document.getElementById("draw").onclick = function () {
    footer.classList.toggle("shut");
    document.getElementById("arrow").textContent = footer.classList.contains("shut") ? "▲" : "▼";
  };
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z")) {
      e.preventDefault(); return step(e.shiftKey ? 1 : -1);
    }
    if (e.key === "Escape" && !nineView.hidden) return closeNine();
    if (/input|select|textarea/i.test(e.target.tagName)) return;
    if (e.key === "r" || e.key === "R") document.getElementById("roll").click();
    if (e.key === "n" || e.key === "N") document.getElementById("nine").click();
    if (e.key === "c" || e.key === "C") document.getElementById("copycode").click();
    if (e.key === "s" || e.key === "S") document.getElementById("save").click();
    if (e.key === "0") fit();
    if (e.key === "t" || e.key === "T") document.getElementById("ttf").click();
  });

  /* the typeface page is next door on the site, and online when this is not */
  (function () {
    var here = location.protocol === "file:" || /github\.io$/.test(location.hostname);
    if (!here) document.getElementById("navType").href =
      "https://yunglong28.github.io/minor-index-atelier/specimen.html";
  })();

  remember(null);
  sync(); render(false);
})();
</script>
